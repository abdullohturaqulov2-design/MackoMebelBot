services:
  - type: worker
    name: macko-mebel-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python performance.py
    envVars:
      - key: DATABASE_URL
        sync: false          # Supabase connection string
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: GEMINI_API_KEY
        sync: false

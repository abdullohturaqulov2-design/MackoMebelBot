<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>QR & Barcode Scanner</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f1a;color:#fff;font-family:-apple-system,sans-serif;min-height:100vh;
     display:flex;flex-direction:column;align-items:center;padding:16px}
h2{font-size:17px;margin:12px 0 4px;color:#7eb3ff;text-align:center}
.subtitle{font-size:12px;color:#888;margin-bottom:14px;text-align:center}

/* Tabs */
.tabs{display:flex;gap:8px;margin-bottom:14px;width:100%;max-width:340px}
.tab{flex:1;padding:9px;border-radius:10px;border:none;cursor:pointer;
     font-size:13px;font-weight:600;transition:.2s}
.tab.active{background:#7eb3ff;color:#000}
.tab:not(.active){background:#1e1e3a;color:#aaa}

/* Camera view */
#cam-view{width:100%;max-width:320px}
.vid-wrap{position:relative;width:100%;aspect-ratio:1;border-radius:16px;overflow:hidden;background:#111}
video{width:100%;height:100%;object-fit:cover}
.frame{position:absolute;inset:28px;border:2.5px solid #7eb3ff;border-radius:10px;
       box-shadow:0 0 0 9999px rgba(0,0,0,.55)}
.corner{position:absolute;width:22px;height:22px;border-color:#4fc3f7;border-style:solid}
.tl{top:22px;left:22px;border-width:3px 0 0 3px;border-radius:4px 0 0 0}
.tr{top:22px;right:22px;border-width:3px 3px 0 0;border-radius:0 4px 0 0}
.bl{bottom:22px;left:22px;border-width:0 0 3px 3px;border-radius:0 0 0 4px}
.br{bottom:22px;right:22px;border-width:0 3px 3px 0;border-radius:0 0 4px 0}
.scan-line{position:absolute;left:28px;right:28px;height:2px;
           background:linear-gradient(90deg,transparent,#4fc3f7,transparent);
           animation:scanAnim 2s linear infinite}
@keyframes scanAnim{0%{top:32px}100%{top:calc(100% - 32px)}}
#cam-status{margin-top:10px;font-size:13px;color:#aaa;text-align:center;min-height:36px}

/* Camera controls */
.cam-btns{display:flex;gap:8px;margin-top:10px;width:100%}
.btn{flex:1;padding:10px;border-radius:10px;border:none;cursor:pointer;
     font-size:13px;font-weight:600}
.btn-main{background:#7eb3ff;color:#000}
.btn-sec{background:#1e1e3a;color:#aaa}

/* Gallery view */
#gal-view{width:100%;max-width:320px;display:none}
.upload-area{border:2px dashed #7eb3ff;border-radius:14px;padding:36px 20px;
             text-align:center;cursor:pointer;transition:.2s;background:#0d0d20}
.upload-area:hover{background:#13133a}
.upload-icon{font-size:48px;margin-bottom:10px}
.upload-text{font-size:14px;color:#aaa}
.upload-text span{color:#7eb3ff;font-weight:600}
#file-input{display:none}
#gal-preview{margin-top:14px;display:none}
#gal-preview img{width:100%;border-radius:10px;max-height:200px;object-fit:contain}
#gal-status{margin-top:10px;font-size:13px;color:#aaa;text-align:center;min-height:36px}
.btn-decode{width:100%;margin-top:10px;padding:12px;border-radius:10px;
            background:#7eb3ff;color:#000;border:none;font-size:14px;
            font-weight:700;cursor:pointer;display:none}

/* Success */
#success-view{display:none;flex-direction:column;align-items:center;gap:14px;padding:20px}
.check{width:80px;height:80px;background:#27ae60;border-radius:50%;
       display:flex;align-items:center;justify-content:center;font-size:42px}
canvas{display:none}
</style>
</head>
<body>
<h2>📦 QR & Barcode Scanner</h2>
<p class="subtitle">MackoMebelBot uchun mahsulot skaner</p>

<div class="tabs">
  <button class="tab active" onclick="switchTab('cam')">📷 Kamera</button>
  <button class="tab" onclick="switchTab('gal')">🖼 Galereya</button>
</div>

<!-- Kamera -->
<div id="cam-view">
  <div class="vid-wrap">
    <video id="video" playsinline muted></video>
    <div class="frame">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
      <div class="scan-line"></div>
    </div>
  </div>
  <p id="cam-status">Kamera yoqilmoqda...</p>
  <div class="cam-btns">
    <button class="btn btn-sec" onclick="flipCamera()">🔄 Kamera</button>
    <button class="btn btn-sec" onclick="toggleTorch()" id="torch-btn">🔦 Chiroq</button>
  </div>
</div>

<!-- Galereya -->
<div id="gal-view">
  <div class="upload-area" onclick="document.getElementById('file-input').click()">
    <div class="upload-icon">📂</div>
    <p class="upload-text"><span>Fayl tanlash</span><br>yoki bu yerga tashlang</p>
  </div>
  <input type="file" id="file-input" accept="image/*">
  <div id="gal-preview"><img id="preview-img"></div>
  <p id="gal-status"></p>
  <button class="btn-decode" id="decode-btn" onclick="decodeImage()">🔍 Skanerlash</button>
</div>

<!-- Muvaffaqiyat -->
<div id="success-view">
  <div class="check">✓</div>
  <p style="font-size:17px;font-weight:700">Skanerlandi!</p>
  <p style="color:#aaa;font-size:13px;text-align:center">Bot javob berishini kuting...</p>
</div>

<canvas id="canvas"></canvas>

<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();

// URL parametrdan avtomatik qidirish (deep link)
const params = new URLSearchParams(window.location.search);
const autoCode = params.get('code') || params.get('start');
if (autoCode) {
  showSuccess();
  setTimeout(() => tg.sendData(JSON.stringify({qr: autoCode})), 500);
}

let codeReader = null;
let facingMode = 'environment';
let torchEnabled = false;
let currentStream = null;
let selectedFile = null;
const hints = new Map();

function initReader() {
  if (codeReader) codeReader.reset();
  codeReader = new ZXing.BrowserMultiFormatReader(hints);
}

// ── Kamera ──────────────────────────────────────────────────────────────────
async function startCamera() {
  initReader();
  try {
    const video = document.getElementById('video');
    const constraints = {video: {facingMode, width:{ideal:1280}, height:{ideal:720}}};
    currentStream = await navigator.mediaDevices.getUserMedia(constraints);
    video.srcObject = currentStream;
    document.getElementById('cam-status').textContent = "QR yoki barkodni ramkaga to'g'irlang";
    codeReader.decodeFromVideoElement(video, (result, err) => {
      if (result) {
        codeReader.reset();
        currentStream?.getTracks().forEach(t => t.stop());
        handleResult(result.getText());
      }
    });
  } catch(e) {
    document.getElementById('cam-status').textContent = "❌ Kamera ruxsati kerak!";
  }
}

function flipCamera() {
  facingMode = facingMode === 'environment' ? 'user' : 'environment';
  codeReader?.reset();
  currentStream?.getTracks().forEach(t => t.stop());
  startCamera();
}

function toggleTorch() {
  const track = currentStream?.getVideoTracks()[0];
  if (!track) return;
  torchEnabled = !torchEnabled;
  track.applyConstraints({advanced:[{torch: torchEnabled}]}).catch(()=>{});
  document.getElementById('torch-btn').textContent = torchEnabled ? '🔦 O\'ch' : '🔦 Yoq';
}

// ── Galereya ────────────────────────────────────────────────────────────────
document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  selectedFile = file;
  const url = URL.createObjectURL(file);
  document.getElementById('preview-img').src = url;
  document.getElementById('gal-preview').style.display = 'block';
  document.getElementById('decode-btn').style.display = 'block';
  document.getElementById('gal-status').textContent = "Skanerlash uchun tugmani bosing";
});

async function decodeImage() {
  if (!selectedFile) return;
  document.getElementById('gal-status').textContent = "🔍 Tahlil qilinmoqda...";
  try {
    const reader = new FileReader();
    reader.onload = async e => {
      const img = new Image();
      img.onload = async () => {
        const canvas = document.getElementById('canvas');
        canvas.width = img.width; canvas.height = img.height;
        canvas.getContext('2d').drawImage(img, 0, 0);
        try {
          initReader();
          const result = await codeReader.decodeFromImageElement(img);
          handleResult(result.getText());
        } catch(err) {
          document.getElementById('gal-status').textContent = "❌ QR/Barcode topilmadi. Boshqa rasm tanlang.";
        }
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(selectedFile);
  } catch(e) {
    document.getElementById('gal-status').textContent = "❌ Xato yuz berdi.";
  }
}

// ── Natijani qayta ishlash ──────────────────────────────────────────────────
function handleResult(text) {
  console.log("Skanerlandi:", text);

  // Bizning bot URL mi? → kodni olish
  // Format: https://t.me/BOT?start=qr_AKR001
  let code = text;
  const telegramMatch = text.match(/[?&]start=qr_([^&]+)/);
  if (telegramMatch) code = telegramMatch[1];
  else if (text.includes('t.me/') && text.includes('start=')) {
    const m = text.match(/start=([^&\s]+)/);
    if (m) code = m[1].startsWith('qr_') ? m[1].slice(3) : m[1];
  }

  showSuccess();
  setTimeout(() => {
    tg.sendData(JSON.stringify({qr: code}));
  }, 600);
}

function showSuccess() {
  document.getElementById('cam-view').style.display = 'none';
  document.getElementById('gal-view').style.display = 'none';
  document.getElementById('success-view').style.display = 'flex';
}

// ── Tab almashtirish ────────────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.tab')[tab === 'cam' ? 0 : 1].classList.add('active');
  if (tab === 'cam') {
    document.getElementById('cam-view').style.display = 'block';
    document.getElementById('gal-view').style.display = 'none';
    startCamera();
  } else {
    codeReader?.reset(); currentStream?.getTracks().forEach(t => t.stop());
    document.getElementById('cam-view').style.display = 'none';
    document.getElementById('gal-view').style.display = 'block';
  }
}

// Boshlash
if (!autoCode) startCamera();
</script>
</body>
</html>

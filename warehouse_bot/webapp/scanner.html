<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>QR & Barcode Scanner</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f0f1a;color:#fff;font-family:-apple-system,sans-serif;
     min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px}
h2{font-size:16px;margin:8px 0 2px;color:#7eb3ff;text-align:center}
.sub{font-size:11px;color:#666;margin-bottom:10px;text-align:center}
.tabs{display:flex;gap:8px;margin-bottom:10px;width:100%;max-width:340px}
.tab{flex:1;padding:8px;border-radius:10px;border:none;cursor:pointer;font-size:13px;font-weight:600;transition:.2s}
.tab.active{background:#7eb3ff;color:#000}
.tab:not(.active){background:#1e1e3a;color:#aaa}
#cam-view{width:100%;max-width:340px}
.vid-wrap{position:relative;width:100%;aspect-ratio:1;border-radius:14px;overflow:hidden;background:#111}
video{width:100%;height:100%;object-fit:cover}
canvas#overlay{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none}
.frame{position:absolute;inset:24px;border:2.5px solid #7eb3ff;border-radius:10px;
       box-shadow:0 0 0 9999px rgba(0,0,0,.5)}
.corner{position:absolute;width:20px;height:20px;border-color:#4fc3f7;border-style:solid}
.tl{top:18px;left:18px;border-width:3px 0 0 3px;border-radius:4px 0 0 0}
.tr{top:18px;right:18px;border-width:3px 3px 0 0;border-radius:0 4px 0 0}
.bl{bottom:18px;left:18px;border-width:0 0 3px 3px;border-radius:0 0 0 4px}
.br{bottom:18px;right:18px;border-width:0 3px 3px 0;border-radius:0 0 4px 0}
.sline{position:absolute;left:24px;right:24px;height:2px;
       background:linear-gradient(90deg,transparent,#4fc3f7,transparent);
       animation:sc 1.8s linear infinite}
@keyframes sc{0%{top:28px}100%{top:calc(100% - 28px)}}
#status{margin-top:8px;font-size:13px;color:#aaa;text-align:center;min-height:32px;padding:0 10px}
.cbts{display:flex;gap:8px;margin-top:8px}
.btn{flex:1;padding:9px;border-radius:10px;border:none;cursor:pointer;font-size:12px;font-weight:600}
.bp{background:#7eb3ff;color:#000}.bs{background:#1e1e3a;color:#aaa}
#gal-view{width:100%;max-width:340px;display:none}
.uarea{border:2px dashed #7eb3ff;border-radius:14px;padding:30px 16px;
       text-align:center;cursor:pointer;background:#0d0d20}
.uico{font-size:40px;margin-bottom:8px}
.utxt{font-size:13px;color:#aaa}.utxt span{color:#7eb3ff;font-weight:600}
#file-input{display:none}
#gprev{margin-top:10px;display:none}
#gprev img{width:100%;border-radius:10px;max-height:180px;object-fit:contain}
#gstatus{margin-top:8px;font-size:13px;color:#aaa;text-align:center;min-height:28px}
.bdec{width:100%;margin-top:8px;padding:11px;border-radius:10px;background:#7eb3ff;
      color:#000;border:none;font-size:14px;font-weight:700;cursor:pointer;display:none}
#succ{display:none;flex-direction:column;align-items:center;gap:12px;padding:20px}
.chk{width:72px;height:72px;background:#27ae60;border-radius:50%;
     display:flex;align-items:center;justify-content:center;font-size:36px}
canvas#hidden{display:none}
</style>
</head>
<body>
<h2>📦 QR & Barcode Scanner</h2>
<p class="sub">MackoMebelBot uchun mahsulot skaner</p>

<div class="tabs">
  <button class="tab active" onclick="switchTab('cam')">📷 Kamera</button>
  <button class="tab" onclick="switchTab('gal')">🖼 Galereya</button>
</div>

<div id="cam-view">
  <div class="vid-wrap">
    <video id="video" playsinline muted></video>
    <canvas id="overlay"></canvas>
    <div class="frame">
      <div class="corner tl"></div><div class="corner tr"></div>
      <div class="corner bl"></div><div class="corner br"></div>
      <div class="sline"></div>
    </div>
  </div>
  <p id="status">Kamera yoqilmoqda...</p>
  <div class="cbts">
    <button class="btn bs" onclick="flipCam()">🔄 Kamera</button>
    <button class="btn bs" id="tbtn" onclick="toggleTorch()">🔦 Yoq</button>
  </div>
</div>

<div id="gal-view">
  <div class="uarea" onclick="document.getElementById('file-input').click()">
    <div class="uico">📂</div>
    <p class="utxt"><span>Rasmni tanlang</span><br>QR yoki barcode bo'lgan rasm</p>
  </div>
  <input type="file" id="file-input" accept="image/*">
  <div id="gprev"><img id="pimg"></div>
  <p id="gstatus"></p>
  <button class="bdec" id="dbtn" onclick="decodeImg()">🔍 Skanerlash</button>
</div>

<div id="succ">
  <div class="chk">✓</div>
  <p style="font-size:16px;font-weight:700">Muvaffaqiyatli!</p>
  <p style="color:#aaa;font-size:12px;text-align:center">Bot javob berishini kuting...</p>
</div>

<canvas id="hidden"></canvas>

<script>
const tg = window.Telegram.WebApp;
tg.ready(); tg.expand();

// Deep link / URL parametr
const ps = new URLSearchParams(window.location.search);
const ac = ps.get('code') || ps.get('qr');
if (ac) { setTimeout(()=>{send(ac)}, 300); }

let scanning = true;
let stream = null;
let facingMode = 'environment';
let torchOn = false;
let animId = null;
let zxReader = null;

const video = document.getElementById('video');
const canvas = document.getElementById('hidden');
const ctx = canvas.getContext('2d');

// ── KAMERA ───────────────────────────────────────────────────────────────────
async function startCam() {
  scanning = true;
  if (animId) cancelAnimationFrame(animId);
  if (stream) stream.getTracks().forEach(t=>t.stop());
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode, width:{ideal:1920}, height:{ideal:1080}}
    });
    video.srcObject = stream;
    await video.play();
    document.getElementById('status').textContent = "QR yoki barkodni ramkaga to'g'irlang";
    scanLoop();
    // ZXing barcode uchun parallel
    startZxing();
  } catch(e) {
    document.getElementById('status').textContent = "❌ Kamera ruxsati kerak!";
  }
}

// jsQR bilan QR code scanning loop
function scanLoop() {
  if (!scanning) return;
  if (video.readyState === video.HAVE_ENOUGH_DATA) {
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    ctx.drawImage(video, 0, 0);
    const img = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const qr = jsQR(img.data, img.width, img.height, {inversionAttempts:"dontInvert"});
    if (qr && qr.data) {
      scanning = false;
      if (animId) cancelAnimationFrame(animId);
      stopStream();
      handleResult(qr.data);
      return;
    }
  }
  animId = requestAnimationFrame(scanLoop);
}

// ZXing bilan barcode scanning
function startZxing() {
  try {
    if (zxReader) zxReader.reset();
    zxReader = new ZXing.BrowserMultiFormatReader();
    zxReader.decodeFromVideoElement(video, (result, err)=>{
      if (result && scanning) {
        scanning = false;
        if (animId) cancelAnimationFrame(animId);
        stopStream();
        handleResult(result.getText());
      }
    });
  } catch(e) {}
}

function stopStream() {
  try { zxReader?.reset(); } catch(e){}
  stream?.getTracks().forEach(t=>t.stop());
}

function flipCam() {
  facingMode = facingMode==='environment'?'user':'environment';
  startCam();
}

function toggleTorch() {
  const t = stream?.getVideoTracks()[0];
  if (!t) return;
  torchOn = !torchOn;
  t.applyConstraints({advanced:[{torch:torchOn}]}).catch(()=>{});
  document.getElementById('tbtn').textContent = torchOn ? '🔦 O\'ch' : '🔦 Yoq';
}

// ── GALEREYA ─────────────────────────────────────────────────────────────────
let selFile = null;
document.getElementById('file-input').addEventListener('change', e=>{
  const f = e.target.files[0]; if(!f) return;
  selFile = f;
  const url = URL.createObjectURL(f);
  document.getElementById('pimg').src = url;
  document.getElementById('gprev').style.display = 'block';
  document.getElementById('dbtn').style.display = 'block';
  document.getElementById('gstatus').textContent = "Skanerlash uchun tugmani bosing";
});

async function decodeImg() {
  if (!selFile) return;
  document.getElementById('gstatus').textContent = "🔍 Tahlil qilinmoqda...";
  try {
    const fr = new FileReader();
    fr.onload = e => {
      const img = new Image();
      img.onload = async ()=>{
        canvas.width = img.width; canvas.height = img.height;
        ctx.drawImage(img, 0, 0);

        // jsQR bilan sinash
        const id = ctx.getImageData(0,0,canvas.width,canvas.height);
        const qr = jsQR(id.data, id.width, id.height, {inversionAttempts:"attemptBoth"});
        if (qr && qr.data) { handleResult(qr.data); return; }

        // ZXing bilan sinash (barcode uchun)
        try {
          const reader = new ZXing.BrowserMultiFormatReader();
          const result = await reader.decodeFromImageElement(img);
          if (result) { handleResult(result.getText()); return; }
        } catch(err) {}

        document.getElementById('gstatus').textContent = "❌ QR/Barcode topilmadi. Boshqa rasm tanlang.";
      };
      img.src = e.target.result;
    };
    fr.readAsDataURL(selFile);
  } catch(e) {
    document.getElementById('gstatus').textContent = "❌ Xato: " + e.message;
  }
}

// ── NATIJA ───────────────────────────────────────────────────────────────────
function handleResult(text) {
  let code = text;
  // Bizning deep link formatmi? t.me/BOT?start=qr_KOD
  const m = text.match(/[?&]start=qr_([^&\s]+)/);
  if (m) code = m[1];
  else if (text.match(/[?&]start=([^&\s]+)/)) {
    const m2 = text.match(/[?&]start=([^&\s]+)/);
    code = m2[1].startsWith('qr_') ? m2[1].slice(3) : m2[1];
  }
  send(code);
}

function send(code) {
  document.getElementById('cam-view').style.display='none';
  document.getElementById('gal-view').style.display='none';
  document.getElementById('succ').style.display='flex';
  setTimeout(()=> tg.sendData(JSON.stringify({qr: code})), 700);
}

// ── TAB ──────────────────────────────────────────────────────────────────────
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t,i)=>
    t.classList.toggle('active', (tab==='cam'&&i===0)||(tab==='gal'&&i===1)));
  if (tab==='cam') {
    document.getElementById('cam-view').style.display='block';
    document.getElementById('gal-view').style.display='none';
    startCam();
  } else {
    scanning=false;
    if(animId) cancelAnimationFrame(animId);
    stopStream();
    document.getElementById('cam-view').style.display='none';
    document.getElementById('gal-view').style.display='block';
  }
}

if (!ac) startCam();
</script>
</body>
</html>
